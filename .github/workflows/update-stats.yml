name: Update OSS stats

on:
  schedule:
    # Every 3 days at 06:00 UTC
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require STATS_TOKEN
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Добавьте repository secret STATS_TOKEN (classic PAT с public_repo)."
            echo "Без него GitHub Search API через GITHUB_TOKEN занижает счётчики."
            exit 1
          fi

      - name: Update stats
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_LOGIN: Ibochkarev
        run: |
          chmod +x scripts/update-stats.sh
          ./scripts/update-stats.sh
          MERGED=$(python3 -c 'import json; print(json.load(open("stats.json"))["merged_prs"])')
          if [ "$MERGED" -lt 600 ]; then
            echo "::error::merged_prs=$MERGED выглядит заниженным — проверьте STATS_TOKEN"
            exit 1
          fi

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json README.md
          git commit -m "chore: refresh open source stats ($(date -u +%Y-%m-%d))"
          git push
