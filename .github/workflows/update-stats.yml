name: Update OSS stats

on:
  schedule:
    # 1st of each month, 06:00 UTC
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update stats
        env:
          # GITHUB_TOKEN даёт неполные search total_count — лучше PAT (public_repo)
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_LOGIN: Ibochkarev
        run: |
          chmod +x scripts/update-stats.sh
          ./scripts/update-stats.sh

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json README.md
          git commit -m "chore: refresh open source stats ($(date -u +%Y-%m-%d))"
          git push
